plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

dependencies {
    // ✅ Required for flutter_local_notifications (Java 8+ time APIs on older Android)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.11.0')
    implementation 'com.google.firebase:firebase-analytics'
}

android {
    namespace = "com.realism.food_recipe_hub"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        // ✅ Enable core library desugaring
        coreLibraryDesugaringEnabled true

        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.realism.food_recipe_hub"
        // ✅ minSdk must be at least 21 for desugaring to work
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
